apiVersion: apps/v1
kind: Deployment
metadata:
  name: buo
  labels:
    app.kubernetes.io/name: buo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: buo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: buo
          image: ghcr.io/lilbrisky/buo-:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
            - name: DATABASE_SSL
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: buo-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: buo-secrets
                  key: jwt-secret
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: buo-secrets
                  key: gemini-api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: buo
  labels:
    app.kubernetes.io/name: buo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: buo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
